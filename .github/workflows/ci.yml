name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra web
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  backend-test:
    name: Test (Python)
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra web
      - name: Run tests
        run: uv run pytest -x -v --tb=short
      - name: Dependency audit
        # Blocking. It was advisory-only, which is how 41 advisories across 13
        # packages accumulated inside runs that reported green.
        #
        # PYSEC-2026-2447 (diskcache) is accepted, not ignored by accident: no
        # fix version exists -- the advisory covers "through 5.6.3", which is
        # the latest release, and it describes pickle being diskcache's default
        # serializer rather than a patchable bug. The only use here is
        # services/defense_cache.py with a hardcoded path that no request can
        # influence, so reaching it needs local write access as the server user.
        # Drop this flag the moment an upstream fix ships.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-2447

  frontend:
    name: Lint & Build (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npx eslint . --max-warnings=20
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
