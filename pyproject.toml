[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "travian-api"
version = "0.1.0"
description = "Travian Legends game automation library and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Travian API", email = "travian-api@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",  # For better CLI output
    "pyyaml>=6.0",   # For build plan files
    "curl_cffi>=0.7.0",  # Chrome TLS fingerprint impersonation
    "diskcache>=5.6.0",  # Persistent disk cache for defense scan
    "cachetools>=5.3.0",  # In-memory TTL cache (L1)
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx[test]",  # For testing HTTP clients
    "mypy>=1.5.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
travian = "travian_api.cli:app"
travian-setup = "travian_api._post_install:main"
travian-web = "travian_api.web:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the built web UI in wheels when it exists (frontend/ builds into
# src/travian_api/web/static; the files are gitignored, not package-ignored).
[tool.setuptools.package-data]
"travian_api.web" = ["static/**/*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
target-version = "py311"
line-length = 100
# Only lint the real codebase, not debug scripts at root
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade (Optional[T] -> T | None, etc.)
    "B",           # bugbear (common mistakes)
    "SIM",         # simplify
    "ASYNC",       # async anti-patterns
    "S",           # bandit security checks
    "T20",         # no print() in production
    "RET",         # return statement checks
    "PIE",         # misc lints
]
ignore = [
    "S101",        # allow assert in tests
    "S603", "S607", # subprocess — not relevant
    "S311",        # random module is intentional for stealth delays (not crypto)
    "S110", "S112", # try-except-pass — many best-effort operations are intentional
    "E501",        # line length handled by formatter
    "B008",        # FastAPI uses Depends() in default args — standard pattern
    "UP006",       # List[x] -> list[x] — skip mass annotation churn
    "UP007",       # X | Y union syntax — keep Optional for pydantic compat
    "UP035",       # deprecated typing imports — skip mass annotation churn
    "UP045",       # Optional[T] -> T | None — skip mass annotation churn
    "RET504",      # unnecessary assignment before return — readability
    "SIM105",      # contextlib.suppress — existing try/except/pass is fine
    "SIM102",      # collapsible-if — nested ifs often more readable
    "B904",        # raise-from — too many to fix now, low risk
    "E741",        # ambiguous var name (l, O) — false positives in game code
    "B007",        # unused loop variable — use _ convention already in place
    "B905",        # zip-without-strict — not needed for game data iteration
    "SIM108",      # ternary suggestion — explicit if/else often more readable
    "SIM110",      # reimplemented-builtin (any/all) — explicit loop is clearer
    "SIM115",      # open-file-with-context — false positive on Path.read_text()
    "E731",        # lambda assignment — used for inline callbacks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"src/travian_api/_post_install.py" = ["T201"]  # CLI script, print() is intentional
"src/travian_api/cli.py" = ["T201", "ASYNC230", "ASYNC240"]  # CLI: print() + sync I/O in async ok
"src/travian_api/web/app.py" = ["S104"]        # 0.0.0.0 bind is intentional for server
"src/travian_api/parsers/html_parser.py" = ["B023"]   # lambda in loop used immediately, not deferred
"src/travian_api/web/routes/farm.py" = ["E402"]        # delayed import for circular dep avoidance
"src/travian_api/web/routes/users.py" = ["S105"]       # "token_type" is not a password
"tests/test_player_pop_filter.py" = ["E402"]           # delayed import after fixture setup

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"